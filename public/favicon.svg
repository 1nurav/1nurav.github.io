<!-- Same signed VB as the nav mark in Nav.astro, so the tab and the header agree.
     Kept in sync by hand: this is a static file and cannot import the component.
     The two hex literals are a deliberate exception to the "colours come from
     custom properties" rule, since a file in public/ cannot read CSS vars, and the
     favicon should hold still while the accent cycles. Values are the bg and
     accent defaults from global.css. Strokes, not text, so no font has to load. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <rect width="40" height="40" fill="#08080a"/>
  <g fill="none" stroke-linecap="round">
    <path d="M3 7 C5 24 7 32 10 31 C13 30 13.5 15 16 8" stroke="#d6ff3f" stroke-width="3.6"/>
    <path d="M21 6 C20 18 20 27 21 32 M21 9 C29 3.5 32.5 11 22 15.5 M22 15.5 C33 15 33.5 29 20.5 31.5" stroke="#f1f1ec" stroke-width="3.4"/>
  </g>
</svg>
