<!-- VB monogram. The two hex literals are a deliberate exception to the
     "colors come from custom properties" rule: a static file in public/ cannot
     read CSS vars, and the favicon must stay put while the accent cycles at
     runtime. Values are the bg and accent defaults from global.css.
     Letterforms are stroked geometry, not text, so no font has to load. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#08080a"/>
  <g fill="none" stroke="#d6ff3f" stroke-width="9" stroke-linejoin="miter" stroke-miterlimit="1">
    <path d="M19 30 L34 70 L49 30"/>
    <path d="M61 30 V70"/>
    <path d="M61 30 H67 A10 10 0 0 1 67 50 H61"/>
    <path d="M61 50 H68.5 A10 10 0 0 1 68.5 70 H61"/>
  </g>
</svg>
