name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v4 of these pinned Node 20, which runners now force onto 24 with a
      # deprecation warning. withastro/action v6 defaults to Node 24 and caches
      # node_modules/.astro, so repeat deploys reuse the optimized images instead
      # of re-encoding all five WebP variants.
      - uses: actions/checkout@v5
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
